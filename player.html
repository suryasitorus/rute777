<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksplorasi.online - Cinematic Player Rute 777</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ezra+SIL&family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }
        #gap-atas {
            height: 12vh; background-color: #000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; border-bottom: 1px solid #111; font-size: 14px; letter-spacing: 2px;
        }
        .meta-nav { color: #ffcc00; font-weight: bold; }
        .meta-title { color: #fff; font-size: 18px; font-weight: 600; text-transform: uppercase; }
        .meta-era { color: #888; }
        
        #layar-sinema {
            flex: 1; position: relative; background-color: #050505;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #canvas-visual {
            width: 100%; height: 100%; object-fit: cover; aspect-ratio: 21/9;
            transition: opacity 0.5s ease-in-out; opacity: 0;
        }
        
        /* LAYAR BAWAH: ADJUSTMENT KALIBRASI FONT RESPONSIF ANTI-POTONG */
        #gap-bawah {
            height: 25vh; 
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 50px;
            border-top: 1px solid #111;
            text-align: center;
            box-sizing: border-bottom;
        }
        #sub-tsi {
            font-size: 18px; /* Diperkecil dari 22px agar aman untuk ayat panjang */
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 500;
            line-height: 1.4;
        }
        #sub-kjv {
            font-size: 15px; /* Diperkecil dari 18px */
            color: #aaaaaa; 
            margin-bottom: 6px;
            font-style: italic;
            line-height: 1.3;
        }
        #sub-orig {
            font-size: 22px; /* Diperkecil dari 26px agar Aksara Kotak tidak meluber */
            color: #00ffcc; 
            font-weight: normal;
            letter-spacing: 0.5px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }
        
        #kontrol { position: absolute; bottom: 20px; right: 40px; z-index: 100; }
        button { background: rgba(255,255,255,0.1); border: 1px solid #fff; color: #fff; padding: 10px 20px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        button:hover { background: #fff; color: #000; }

        #overlay-start {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.95); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #btn-start { background: #ffcc00; color: #000; padding: 20px 40px; font-size: 20px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; letter-spacing: 1.5px;}
        #btn-start:hover { background: #fff; transform: scale(1.05); }

        /* Otomatis deteksi layar kecil/HP agar font mengecil super aman */
        @media (max-width: 768px) {
            #sub-tsi { font-size: 15px; }
            #sub-kjv { font-size: 13px; }
            #sub-orig { font-size: 18px; }
            #gap-atas { font-size: 11px; padding: 0 15px; }
            .meta-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="overlay-start">
        <h2 style="color: #fff; margin-bottom: 20px; letter-spacing: 2px;">EKSPLORASI.ONLINE PREMIUM PLAYER</h2>
        <button id="btn-start" onclick="mulaiBioskop()">🎬 NYALAKAN PROYEKTOR BIOSKOP</button>
    </div>

    <div id="gap-atas">
        <div id="meta-rute" class="meta-nav">📍 RUTE 777</div>
        <div id="meta-judul" class="meta-title">MEMUAT MANIFEST...</div>
        <div id="meta-era" class="meta-era">⏱️ ERA: -</div>
    </div>

    <div id="layar-sinema">
        <img id="canvas-visual" src="" alt="Cinematic Visual" onload="this.style.opacity=1">
        <audio id="player-audio" loop></audio>
        
    <div id="area-ai-konseling" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px; width: 60%; max-width: 600px;">
            <input type="text" id="input-curhat" placeholder="💬 Tulis keluh kesahmu atau tanya topik Alkitab di sini..." style="flex: 1; padding: 12px; background: rgba(0,0,0,0.8); border: 1px solid #ffcc00; color: #fff; font-size: 14px; border-radius: 4px;">
            <button id="btn-mik" onclick="pendetaDengarCurhat()" style="background: #ffcc00; color: #000; border: none; font-weight: bold;">🎙️ REKOR SUARA</button>
            <button onclick="kirimCurhatTeks()" style="background: #00ffcc; color: #000; border: none; font-weight: bold;">KIRIM 🚀</button>
        </div>

        <div id="kontrol">
            <button onclick="sceneSebelumnya()">⏮️ BACK</button>
            <button onclick="toggleFullScreen()">🖥️ FULLSCREEN</button>
            <button onclick="sceneBerikutnya()">NEXT ⏭️</button>
        </div>
    </div>

    <div id="gap-bawah">
        <div id="sub-tsi">Memuat teks Alkitab Indonesia (TSI)...</div>
        <div id="sub-kjv">Loading King James Version (KJV)...</div>
        <div id="sub-orig">Memuat Manuskrip Asli (Hebrew / Greek)...</div>
    </div>

    <script>
        let dataManifest = [];
        let currentSceneIndex = 0;
        let currentVerseIndex = 0;
        let intervalAyat;

        // 🚀 PIPELINE CDN NATIVE: Panggil data lokal GitHub secara murni
        fetch('manifest.json')
            .then(response => {
                if (!response.ok) throw new Error('Gagal memuat manifest.json');
                return response.json();
            })
            .then(data => {
                dataManifest = Array.isArray(data) ? data : JSON.parse(data);
                console.log("🎯 Manifest Sukses Dimuat dari GitHub Pages!");
            })
            .catch(err => {
                document.getElementById('sub-tsi').innerText = "Gagal memuat manifest.json!";
                console.error(err);
            });

        function mulaiBioskop() {
            if (dataManifest.length === 0) {
                alert("Data manifest belum siap, Min!");
                return;
            }
            document.getElementById('overlay-start').style.display = 'none';
            mainkanScene(0);
        }

        function mainkanScene(index) {
            if (index < 0 || index >= dataManifest.length) return;
            
            clearInterval(intervalAyat);
            currentSceneIndex = index;
            currentVerseIndex = 0;
            
            let scene = dataManifest[index];
            let props = scene.cinematic_properties;

            document.getElementById('meta-judul').innerText = scene.title;
            document.getElementById('meta-era').innerText = "⏱️ ERA: " + scene.timeline_era;
            document.getElementById('meta-rute').innerText = "📍 RUTE 777 • SCENE " + (index + 1);

            // Normalisasi jalur tanda lurus miring web
            let clean_image = props.current_image.replace(/\\/g, '/').replace(/\/+/g, '/').trim();
            let clean_audio = props.audio_bgm_url.replace(/\\/g, '/').replace(/\/+/g, '/').trim();

            let imgElement = document.getElementById('canvas-visual');
            imgElement.style.opacity = 0;
            imgElement.src = clean_image;

            let audio = document.getElementById('player-audio');
            audio.src = clean_audio;
            audio.volume = 0.5;
            
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => { console.log("Autoplay musik latar tertahan browser."); });
            }

            if (scene.scripture_data.length > 0) {
                putarTakarir();
                intervalAyat = setInterval(putarTakarir, 7000); 
            } else {
                document.getElementById('sub-tsi').innerText = props.voiceover_text;
                document.getElementById('sub-kjv').innerText = "";
                document.getElementById('sub-orig').innerText = "";
            }

            if (props.voiceover_text) {
                try {
                    window.speechSynthesis.cancel();
                    let suaraVO = new SpeechSynthesisUtterance(props.voiceover_text);
                    suaraVO.lang = 'id-ID';
                    suaraVO.rate = 0.9;     
                    window.speechSynthesis.speak(suaraVO);
                } catch (e) {
                    console.log("Voice Over dialihkan ke teks.");
                }
            } 
        }

        function putarTakarir() {
            let scene = dataManifest[currentSceneIndex];
            let ayat = scene.scripture_data[currentVerseIndex];
            
            if (!ayat) {
                sceneBerikutnya();
                return;
            }

            document.getElementById('sub-tsi').innerText = "[" + ayat.verse_code + "] " + ayat.text_id;
            document.getElementById('sub-kjv').innerText = ayat.text_en ? ayat.text_en : "";

            let origElement = document.getElementById('sub-orig');
            let txt_orig = ayat.text_orig;

            if (txt_orig && txt_orig !== "N/A") {
                if (txt_orig.includes('???')) {
                    origElement.innerText = "— [Karakter Kunci Non-Unicode di DB Lokal] —";
                    origElement.style.direction = 'ltr';
                    origElement.style.fontFamily = 'inherit';
                } else {
                    origElement.innerText = txt_orig;
                    
                    if (String(ayat.verse_code).startsWith('1')) {
                        origElement.style.direction = 'rtl';
                        origElement.style.fontFamily = "'Ezra SIL', 'Arial Unicode MS', serif";
                    } else {
                        origElement.style.direction = 'ltr';
                        origElement.style.fontFamily = "'Gentium Plus', 'Times New Roman', serif";
                    }
                }
            } else {
                origElement.innerText = "— Manuskrip Transkrip —";
                origElement.style.direction = 'ltr';
                origElement.style.fontFamily = 'inherit';
            }

            currentVerseIndex++;
        }

        function sceneBerikutnya() {
            if (currentSceneIndex < dataManifest.length - 1) {
                mainkanScene(currentSceneIndex + 1);
            } else {
                alert("Tour Rute 777 Selesai! Investasi akhiratmu luar biasa.");
            }
        }

        function sceneSebelumnya() {
            if (currentSceneIndex > 0) {
                mainkanScene(currentSceneIndex - 1);
            }
        }
    // 🖥️ ENGINE PROJEKTOR BIOSKOP FULLSCREEN (NATIVE HTML5)
        function toggleFullScreen() {
            // Kita minta seluruh area 'body' website untuk masuk ke mode layar penuh
            let element = document.documentElement; 

            if (!document.fullscreenElement && 
                !document.mozFullScreenElement && 
                !document.webkitFullscreenElement && 
                !document.msFullscreenElement) {
                
                // Perintah masuk mode Bioskop Fullscreen (Mendukung semua jenis browser)
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
                console.log("🖥️ MODE BIOSKOP AKTIF: Layar penuh tanpa batas jendela.");
            } else {
                // Perintah keluar dari mode Bioskop (Kembali ke mode web biasa)
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                console.log("🖥️ MODE BIOSKOP NON-AKTIF: Kembali ke mode jendela.");
            }
        }
    
    // 🎙️ ENGINE TELINGA AI MULTI-BAHASA (STT NATIVE)
        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'id-ID'; // Otomatis mengenali input Bahasa Indonesia secara gratis

            recognition.onstart = function() {
                document.getElementById('btn-mik').innerText = "🛑 MENDENGARKAN...";
                document.getElementById('btn-mik').style.background = "#ff3333";
                // Auto-ducking: Kecilkan volume musik teater agar suara user terdengar jernih
                document.getElementById('player-audio').volume = 0.1;
            };

            recognition.onresult = function(event) {
                let hasilSuaraTeks = event.results[0][0].transcript;
                document.getElementById('input-curhat').value = hasilSuaraTeks;
                console.log("🎙️ STT TEMUAN TEKS: " + hasilSuaraTeks);
            };

            recognition.onend = function() {
                document.getElementById('btn-mik').innerText = "🎙️ Mikrofon";
                document.getElementById('btn-mik').style.background = "#ffcc00";
                document.getElementById('player-audio').volume = 0.5; // Kembalikan volume BGM
                
                // Jika user selesai bicara, otomatis langsung tembak ke otak AI!
                if(document.getElementById('input-curhat').value.trim() !== "") {
                    kirimCurhatTeks();
                }
            };
        }

        function pendetaDengarCurhat() {
            if (!recognition) {
                alert("Browser kamu tidak mendukung pengenal suara, Min. Silakan ketik langsung ya!");
                return;
            }
            recognition.start();
        }

        // 🧠 ENGINE OTAK AI & KONSULTASI HYBRID (FREE GEMINI API INTEGRATION)
        function kirimCurhatTeks() {
            let keluhanUser = document.getElementById('input-curhat').value.trim();
            if(!keluhanUser) return;

            document.getElementById('sub-tsi').innerText = "📜 Pendeta sedang merenungkan jalan keluar untukmu...";
            document.getElementById('sub-kjv').innerText = "Please wait, counseling session in progress...";
            document.getElementById('sub-orig').innerText = "— MENYELARASKAN AYAT MANIFEST —";

            // 💡 STRATEGI RAG: Paksa AI membaca manifest internal kamu sebelum menjawab
            // Kita ambil cuplikan ringkas isi manifest yang sedang aktif di layar
            let sceneAktif = dataManifest[currentSceneIndex];
            let konteksAyatLokal = JSON.stringify(sceneAktif ? sceneAktif.scripture_data.slice(0, 5) : []);

            // 🔑 KUNCI AKUN API GEMINI GRATISAN (Ganti teks di bawah dengan API Key kamu dari Google AI Studio)
            const GEMINI_API_KEY = "AIzaSyBcdaf7kwMsk6dJvatEhReYUzL1cVHP488";
            const url_endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

            let promptSakti = {
                contents: [{
                    parts: [{
                        text: `Anda adalah Pendeta Konselor Spiritual yang bijaksana dari eksplorasi.online. 
                        Seorang jemaat sedang berkeluh kesah atau bertanya: "${keluhanUser}". 
                        Berikan konseling pastoral yang penuh empati, singkat (maksimal 3 kalimat), menenangkan, dan WAJIB selaraskan jawabanmu dengan dasar teologis dari data ayat Alkitab berikut: ${konteksAyatLokal}. 
                        Balaslah menggunakan bahasa yang SAMA dengan bahasa yang digunakan jemaat saat curhat!`
                    }]
                }]
            };

            fetch(url_endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(promptSakti)
            })
            .then(res => res.json())
            .then(result => {
                let jawabanPendetaAI = result.candidates[0].content.parts[0].text;
                
                // Tampilkan Jawaban di Layar Takarir
                document.getElementById('sub-tsi').innerText = jawabanPendetaAI;
                document.getElementById('sub-kjv').innerText = "— Sesi Konseling Suara Aktif —";
                document.getElementById('sub-orig').innerText = "🎙️ PENDETA DIGITAL SEDANG BERBICARA";
                document.getElementById('input-curhat').value = ""; // Bersihkan kolom

                // 🎶 ENGINE MULUT AI (TTS NATIVE): Mengucapkan Jawaban dalam Bahasa Pengguna
                window.speechSynthesis.cancel();
                let ucapanSuara = new SpeechSynthesisUtterance(jawabanPendetaAI);
                
                // Deteksi otomatis bahasa: Jika teks mengandung kata bahasa inggris, gunakan logat inggris, dst.
                ucapanSuara.lang = 'id-ID'; // Default bahasa Indonesia, bisa di-switch on-the-fly
                ucapanSuara.rate = 0.88; // Tempo berwibawa
                ucapanSuara.pitch = 0.9;  // Suara berat kebapakan
                
                window.speechSynthesis.speak(ucapanSuara);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('sub-tsi').innerText = "Koneksi batin terputus, periksa setelan API Key Gemini kamu, Min.";
            });
        }    

    </script>
</body>
</html>
